name: enterprise-asset-management

# 基础设施: Redis + Nacos
# MySQL 复用本机 Windows 服务 (localhost:3306), 已包含 asset_management 数据库
# 启动: docker compose up -d
# 停止: docker compose down

services:
  redis:
    image: redis:7-alpine
    container_name: asset-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v3.2.0
    container_name: asset-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      # Nacos 3.x 认证必需项
      NACOS_AUTH_TOKEN: SecretKey012345678901234567890123456789012345678901234567890123456789
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: security_secret
    ports:
      - "8848:8848"
      - "9848:9848"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
